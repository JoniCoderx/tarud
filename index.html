<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tarud — Heartbreak Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0a10; --panel:#14121b; --line:#2a2533; --ink:#f2ede6; --muted:#9a92a6; --gold:#6ea8fe; --gold-deep:#3d7bf0; --steel:#b4c4d6; --heart:#ff6b81; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%, #2a1a2e 0%, transparent 55%),radial-gradient(100% 70% at 80% 110%, #241a12 0%, transparent 50%),var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));-webkit-tap-highlight-color:transparent;position:relative;overflow-x:hidden}
  body[dir="rtl"]{font-family:"Rubik","Space Grotesk",sans-serif}
  #fxCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .app{width:100%;max-width:480px;position:relative;z-index:1}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:13px}
  .avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;animation:glow 3.4s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 6px 20px -6px rgba(0,0,0,.7)}50%{box-shadow:0 6px 28px -3px rgba(110,168,254,.55)}}
  .brand .name{font-family:"Fraunces",serif;font-size:clamp(34px,8.4vw,46px);font-weight:600;line-height:1;white-space:nowrap}
  body[dir="rtl"] .brand .name{font-family:"Rubik";font-weight:800}
  .brand .name span{font-family:"Space Grotesk";display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
  body[dir="rtl"] .brand .name span{font-family:"Rubik";letter-spacing:.03em;text-transform:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12.5px;font-weight:600;flex-shrink:0}
  .lang button{background:transparent;color:var(--muted);border:none;padding:8px 14px;cursor:pointer;font-family:"Space Grotesk",sans-serif;white-space:nowrap}
  .lang button:last-child{font-family:"Rubik",sans-serif}
  .lang button.on{background:var(--gold-deep);color:#fff}

  .lede{font-family:"Fraunces",serif;font-style:italic;font-size:clamp(20px,5vw,26px);line-height:1.3;margin:20px 2px 4px}
  body[dir="rtl"] .lede{font-family:"Rubik";font-style:normal;font-weight:700}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 2px 18px}

  .card{background:linear-gradient(180deg,var(--panel),#100e16);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
  .q{font-weight:600;font-size:15px;margin-bottom:14px}
  .q small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:3px}

  /* character picker */
  .charpick{display:flex;gap:12px;margin-bottom:16px}
  .charcard{flex:1;background:linear-gradient(180deg,var(--panel),#100e16);border:1px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;text-align:center;transition:.15s;font-family:inherit;color:var(--ink)}
  .charcard:hover{border-color:var(--gold-deep);transform:translateY(-3px);box-shadow:0 12px 34px -8px rgba(110,168,254,.5)}
  .charcard[data-char="meforak"]:hover{border-color:var(--steel);box-shadow:0 12px 34px -8px rgba(180,196,214,.5)}
  .charcard.on{border-color:var(--gold-deep);background:rgba(110,168,254,.1);box-shadow:0 0 30px -6px rgba(110,168,254,.35)}
  .charcard.on[data-char="meforak"]{border-color:var(--steel);background:rgba(180,196,214,.1);box-shadow:0 0 30px -6px rgba(180,196,214,.35)}
  .charcard img{width:66px;height:66px;border-radius:50%;object-fit:cover;margin-bottom:8px;transition:transform .2s}
  .charcard:hover img{transform:scale(1.07)}
  .charcard .cname{font-weight:700;font-size:15px}
  .charcard .ctag{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}

  .score-head{display:flex;align-items:center;justify-content:center;gap:14px}
  .score-num{font-family:"Fraunces",serif;font-size:60px;font-weight:600;color:var(--gold);line-height:1;transition:color .2s}
  .score-num em{font-size:20px;color:var(--muted);font-style:normal}
  .mood-emoji{font-size:40px;line-height:1;transform:translateY(-3px)}
  .pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .score-label{text-align:center;color:var(--ink);font-size:14px;min-height:20px;margin:8px 0 16px;font-style:italic;font-family:"Fraunces",serif}
  body[dir="rtl"] .score-label{font-family:"Rubik";font-style:normal}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;direction:ltr;background:linear-gradient(90deg,var(--gold) 0%,var(--gold) var(--pct,50%),#241f2c var(--pct,50%),#241f2c 100%);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eaf2ff,var(--gold-deep));cursor:pointer;border:3px solid #0b0a10;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);cursor:pointer;border:3px solid #0b0a10}
  .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px;direction:ltr}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#0e0c14;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s;font-weight:500}
  .chip:hover{color:var(--ink);border-color:#3b3547}
  .chip.on{background:rgba(110,168,254,.14);border-color:var(--gold-deep);color:var(--gold)}

  textarea{width:100%;min-height:110px;resize:vertical;background:#0e0c14;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:inherit;font-size:14.5px;line-height:1.55;padding:13px 14px}
  textarea:focus{outline:none;border-color:var(--gold-deep)}
  textarea::placeholder{color:#6b6376}

  .btn{width:100%;font-family:"Space Grotesk";font-weight:700;font-size:16px;color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border:none;border-radius:999px;padding:15px;cursor:pointer;transition:transform .1s,filter .15s;box-shadow:0 12px 30px -12px rgba(61,123,240,.7)}
  body[dir="rtl"] .btn{font-family:"Rubik"}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none;font-weight:600;font-size:14px;padding:12px}
  .btn.ghost:hover{color:var(--ink)}
  .hidden{display:none!important}
  .btnrow{display:flex;gap:10px;margin-bottom:10px}.btnrow .btn{margin-bottom:0;flex:1;font-size:15px;padding:13px}
  .btn.wa{background:#25d366;color:#06331a;box-shadow:none}
  .btn.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff;box-shadow:none}
  @keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .viewin{animation:viewin .3s ease both}
  .loading p{animation:pulseline 1.4s ease-in-out infinite}@keyframes pulseline{0%,100%{opacity:.55}50%{opacity:1}}

  .loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 10px}
  .pulse{width:84px;height:84px;border-radius:50%;object-fit:cover;animation:beat 1.1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}45%{transform:scale(1)}}
  .loading p{color:var(--muted);font-style:italic;font-family:"Fraunces",serif;font-size:15px}
  body[dir="rtl"] .loading p{font-family:"Rubik";font-style:normal}

  .result-emoji{font-size:48px;line-height:1;text-align:center;margin-bottom:6px}
  .result .verdict{font-family:"Fraunces",serif;font-size:clamp(26px,6.4vw,32px);font-weight:600;color:var(--gold);line-height:1.2;text-align:center;margin-bottom:4px}
  body[dir="rtl"] .result .verdict{font-family:"Rubik"}
  .result .from{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:0}
  .fromrow{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px}
  .from-av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
  body[dir="rtl"] .result .from{letter-spacing:.02em;text-transform:none}
  .msg{font-size:18.5px;line-height:1.72;color:var(--ink)}
  .block{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
  .block .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px;font-weight:600}
  body[dir="rtl"] .block .k{letter-spacing:.02em;text-transform:none}
  .block .v{font-size:16px;line-height:1.72;color:var(--ink)}
  .closer{font-family:"Fraunces",serif;font-style:italic;font-size:18px;color:var(--gold);text-align:center;margin-top:18px;line-height:1.45}
  body[dir="rtl"] .closer{font-family:"Rubik";font-style:normal}

  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .result.anim .result-emoji,.result.anim .verdict,.result.anim .from,.result.anim .msg,.result.anim .block,.result.anim .closer,.result.anim .scorepill{animation:riseIn .5s ease both}
  .result.anim .verdict{animation-delay:.08s}.result.anim .from{animation-delay:.12s}.result.anim .msg{animation-delay:.18s}.result.anim .block{animation-delay:.26s}.result.anim .closer{animation-delay:.34s}

  .stamp-wrap{display:flex;justify-content:center;margin-bottom:10px}
  .stamp{position:relative;border:3px solid var(--gold);border-radius:14px;padding:8px 20px 6px;transform:rotate(-6deg);box-shadow:0 0 24px rgba(110,168,254,.25);background:rgba(110,168,254,.05)}
  .stamp.reveal{animation:stampIn .6s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes stampIn{0%{opacity:0;transform:rotate(-24deg) scale(2.2)}60%{opacity:1;transform:rotate(-3deg) scale(.9)}100%{transform:rotate(-6deg) scale(1)}}
  .stamp .word{font-family:"Fraunces",serif;font-weight:600;font-size:30px;letter-spacing:.04em;color:var(--gold);line-height:1;text-align:center}
  body[dir="rtl"] .stamp .word{font-family:"Rubik";font-weight:800}
  .stamp .gloss{font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--gold-deep);text-align:center;margin-top:5px;font-weight:600}
  body[dir="rtl"] .stamp .gloss{letter-spacing:.03em;text-transform:none}
  .stamp.lvl-meforak{border-color:#d8a24a}
  .stamp.lvl-gamur{border-color:var(--heart);box-shadow:0 0 26px rgba(255,107,129,.3)}
  .stamp.lvl-gamur .word,.stamp.lvl-gamur .gloss{color:var(--heart)}

  .scorepill{display:flex;align-items:center;gap:6px;background:#1c1622;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--muted);margin:0 auto 14px;width:max-content;max-width:100%;text-align:center;line-height:1.4}
  .scorepill b{color:var(--heart)}

  /* meme */
  .meme{text-align:center}
  .meme-face{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:4px auto 16px;display:block;box-shadow:0 8px 24px -8px rgba(0,0,0,.7)}
  .meme-cap{font-family:"Anton",sans-serif;font-size:clamp(20px,5.4vw,26px);line-height:1.25;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);letter-spacing:.01em}
  body[dir="rtl"] .meme-cap{font-family:"Rubik";font-weight:800}
  .meme-by{color:var(--muted);font-size:12px;margin-top:14px;letter-spacing:.06em}

  .err{color:#ff9a9a;font-size:13.5px;line-height:1.5;text-align:center}
  .footer{color:#5f5869;font-size:11px;line-height:1.55;text-align:center;margin-top:22px;padding:0 8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--gold-deep);color:#fff;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .logo{width:64px;height:64px;flex-shrink:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(110,168,254,.18))}
  .controls{display:flex;align-items:center;gap:8px}
  .theme-btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:15px;cursor:pointer;line-height:1;flex-shrink:0;transition:.15s}
  .theme-btn:hover{border-color:var(--gold-deep)}
  .tts{display:flex;gap:10px;margin-bottom:10px}.tts .btn{margin-bottom:0;flex:1}
  .voice-btn{width:54px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;font-size:20px;flex-shrink:0;transition:.15s}
  .voice-btn:hover{border-color:var(--gold-deep)}
  .caseno{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-align:center;margin:-8px 0 14px;text-transform:uppercase}
  body,body *{transition:background-color .25s ease,color .2s ease,border-color .2s ease}
  body.light{--bg:#f4efe7;--panel:#ffffff;--line:#e7ded1;--ink:#241b13;--muted:#857b6c;--gold:#2f6fe0;--gold-deep:#2559c4;background:radial-gradient(120% 80% at 50% -10%,#fbe6d0 0%,transparent 55%),radial-gradient(100% 70% at 80% 110%,#efe1cd 0%,transparent 50%),var(--bg);color:var(--ink)}
  body.light .card{background:linear-gradient(180deg,#ffffff,#f8f3ec)}
  body.light .charcard{background:linear-gradient(180deg,#ffffff,#f8f3ec)}
  body.light textarea{background:#fbf7f0;color:var(--ink)}
  body.light textarea::placeholder{color:#a99f8f}
  body.light .chip{background:#f2ece2}
  body.light .overlay{background:linear-gradient(180deg,rgba(244,239,231,.72),rgba(244,239,231,.9))}
  body.light .msg,body.light .block .v,body.light .score-num{color:#2a2117}
  body.light .btn.ghost{color:#6a6154}
  body.light .theme-btn,body.light .voice-btn,body.light .lang button{color:#241b13}
  body.light .lang button.on{color:#fff}
  body.light .best-card,body.light .scorepill{background:#f2ece2}
  @media (max-width:430px){
    .topbar{gap:8px}
    .brand{gap:10px}
    .logo{width:54px;height:54px}
    .brand .name{font-size:30px}
    .brand .name span{font-size:9px;margin-top:5px}
    .lang button{padding:7px 10px;font-size:11.5px}
    .theme-btn{width:34px;height:34px;font-size:14px}
    .controls{gap:6px}
  }
  @media (max-width:360px){
    .logo{width:48px;height:48px}
    .brand .name{font-size:27px}
    .lang button{padding:6px 8px;font-size:11px}
  }

  /* ================= UI/UX v2 (design pass) ================= */
  :root{ --r:20px; --btnr:16px; }
  /* glassy cards + rhythm */
  .card{background:linear-gradient(180deg,rgba(30,26,40,.72),rgba(16,14,22,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 12px 34px -22px rgba(0,0,0,.95)}
  body.light .card{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(248,243,236,.92));border-color:rgba(0,0,0,.06);box-shadow:0 12px 30px -22px rgba(120,90,40,.45)}
  .q{font-size:13px;letter-spacing:.01em;opacity:.96;margin-bottom:12px}
  .q small{font-size:12px;opacity:.85}
  #input-view{padding-bottom:8px}
  .sub{margin-bottom:16px}

  /* unified button system */
  .btn{min-height:52px;border-radius:var(--btnr);font-size:16px;padding:14px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em;box-shadow:0 12px 26px -16px rgba(110,168,254,.85);transition:transform .12s ease,filter .15s ease,box-shadow .15s ease}
  .btn:hover{filter:brightness(1.06);box-shadow:0 16px 32px -16px rgba(110,168,254,.95)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(110,168,254,.55)}
  .btn.ghost{min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);font-size:14.5px;box-shadow:none}
  .btn.ghost:hover{color:var(--ink);border-color:#3b3547;background:rgba(255,255,255,.05)}
  .btn.ghost:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  body.light .btn.ghost{background:rgba(0,0,0,.02)}
  .btnrow .btn{min-height:48px}
  .btn.wa{background:#25d366;color:#04240f;box-shadow:0 12px 26px -18px rgba(37,211,102,.9)}
  .btn.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff;box-shadow:0 12px 26px -18px rgba(214,41,118,.85)}
  /* sticky primary CTA */
  #askBtn{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;margin-top:4px}

  /* chips: 44px tap, cleaner states */
  .chip{min-height:40px;display:inline-flex;align-items:center;padding:9px 14px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
  .chip:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(110,168,254,.5)}
  .chip.on{background:rgba(110,168,254,.16);border-color:var(--gold-deep);color:var(--gold);font-weight:600}
  body.light .chip{background:rgba(0,0,0,.03)}

  /* character picker = premium 'modes' */
  .charpick{gap:12px;margin-bottom:14px}
  .charcard{padding:18px 12px 15px;border-radius:var(--r);border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(30,26,40,.72),rgba(16,14,22,.72));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden}
  body.light .charcard{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(248,243,236,.92));border-color:rgba(0,0,0,.06)}
  .charcard::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 60% at 50% -12%,rgba(110,168,254,.14),transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
  .charcard:hover::after,.charcard.on::after{opacity:1}
  .charcard[data-char="meforak"]::after{background:radial-gradient(120% 60% at 50% -12%,rgba(180,196,214,.16),transparent 60%)}
  .charcard img{width:72px;height:72px;border:2px solid rgba(255,255,255,.1);box-shadow:0 8px 20px -10px rgba(0,0,0,.8)}
  .charcard.on img{border-color:var(--gold)}
  .charcard.on[data-char="meforak"] img{border-color:var(--steel)}
  .charcard .cname{font-size:15.5px}
  .charcard.on::before{content:"✓";position:absolute;top:10px;inset-inline-end:12px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#170f06;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
  .charcard.on[data-char="meforak"]::before{background:var(--steel);color:#0e1418}

  /* score hero + emoji alignment */
  .score-head{gap:16px;align-items:center}
  .score-num{font-size:64px}
  .mood-emoji{font-size:44px;transform:none;line-height:1;display:inline-flex;align-items:center;height:64px}

  /* result reveal polish */
  .result-emoji{font-size:52px;display:flex;justify-content:center;line-height:1;height:56px;align-items:center}
  .scorepill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 16px}
  body.light .scorepill{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08)}
  .stamp{border-width:2.5px;border-radius:16px;padding:10px 24px 8px;background:rgba(255,255,255,.03)}
  .stamp .word{font-size:32px;letter-spacing:.05em}

  async function fetchAI(payload,tries){
    let lastErr;
    for(let i=0;i<tries;i++){
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),32000);
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:ctrl.signal});
        clearTimeout(to);
        if(res.ok) return await res.json();
        if(res.status>=400 && res.status<500 && res.status!==429) throw new Error("status "+res.status);
        lastErr=new Error("status "+res.status);
      }catch(e){ clearTimeout(to); lastErr=e; }
      await new Promise(r=>setTimeout(r,700*(i+1)));
    }
    throw lastErr||new Error("failed");
  }
  function parseAI(data){
    let out=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
    out=out.replace(/```json/gi,'').replace(/```/g,'').trim();
    try{ return JSON.parse(out); }
    catch(e){ const m=out.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
      return out? {verdict:'',message:out,tip:"",closer:""} : null; }
  }
  async function fetchFreeAI(system,user){
    const msgs=[{role:"system",content:system},{role:"user",content:user}];
    function withTimeout(ms){ const c=new AbortController(); const to=setTimeout(function(){c.abort();},ms); return {signal:c.signal, done:function(){clearTimeout(to);}}; }
    // 1. POST /openai (chat format)
    try{ const g=withTimeout(9000); try{ const res=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:msgs,referrer:"tarud"}),signal:g.signal}); if(res.ok){ const t=await res.text(); if(t&&t.trim()) return t; } }finally{ g.done(); } }catch(e){}
    // 2. GET text endpoint (very reliable, CORS-open)
    try{ const g=withTimeout(9000); try{ const prompt=system+"\n\n"+user+"\n\nReturn ONLY the JSON object, no extra text."; const res=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt)+"?model=openai&referrer=tarud",{signal:g.signal}); if(res.ok){ const t=await res.text(); if(t&&t.trim()) return t; } }finally{ g.done(); } }catch(e){}
    throw new Error("free ai failed");
  }
  function parseFree(txt){
    if(!txt) return null;
    let content=txt;
    try{ const j=JSON.parse(txt);
      if(j && typeof j==='object'){
        if(j.choices && j.choices[0] && j.choices[0].message) content=j.choices[0].message.content;
        else if(j.message||j.verdict) return j;
        else if(typeof j.content==='string') content=j.content;
      }
    }catch(e){}
    content=String(content).replace(/```json/gi,'').replace(/```/g,'').trim();
    try{ return JSON.parse(content); }
    catch(e){ const m=content.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} } return content?{verdict:'',message:content,tip:'',closer:''}:null; }
  }

    const modeInstr={comfort:"Tone: gentle, warm, steady reassurance.",straight:"Tone: honest, no-nonsense truth, still kind.",laugh:"Tone: warm humor and light self-aware roasting, never cruel.",hype:"Tone: motivational hype-man energy that helps him reclaim himself."}[selMode];

    const system=persona+" A heartbroken man rated his own heartbreak from 1 to 10 and told you what he's going through. "+modeInstr+
      " IF he actually sounds okay, good, healing, or happy (he’s fine, over her, or it’s good news), do NOT force heartbreak — read the room, give a LOW level, and be genuinely happy and hyped for him. Be perceptive and relatable: catch the subtext, sound like a real person who truly gets it, stay concrete, and keep it short and punchy, no rambling. READ HIS WORDS CLOSELY and answer what he ACTUALLY said — name the specific person, situation and details he gave. Never be generic or one-size-fits-all. "+

    {p:3,emoji:'🍺',level:7,keywords:['שתיתי הערב','שותה כדי לשכוח','נשבר לי ושתיתי','שיכור','לשתות עד שאשכח','שותה על זה','שתיתי הרבה'],responses:['אני מבין את הרצון להשתיק את הכאב, אבל אלכוהול רק דוחה אותו למחר, בדרך כלל עם ריבית. הלילה תשים את הכוס בצד. תשתה מים, תאכל משהו, ותן לעצמך לישון. אתה לא צריך למחוק את הרגש, רק לעבור את הערב בבטחה.','לשתות כדי לשכוח זה כמו להלוות רוגע מהמחר. הבוקר יבוא כבד יותר. עדיף להרגיש קצת עכשיו מאשר להתעורר גרוע. תעצור פה, תשתה מים, ותלך לישון.'],short:['אלכוהול רק דוחה את הכאב למחר, עם ריבית.','אתה לא צריך למחוק את הרגש, רק לעבור את הערב בבטחה.'],action:'שים את הכוס בצד, שתה מים, תאכל משהו, ולך לישון.'},
    {p:6,emoji:'🌱',level:6,keywords:['האהבה הראשונה שלי','הבחורה הראשונה','זו הפעם הראשונה שאני מאוהב','אף פעם לא הרגשתי ככה','היא הראשונה','אהבה ראשונה'],responses:['אהבה ראשונה חורתת עמוק כי אין לך עם מה להשוות, ומרגיש שאין אחרי. אבל יש. הלב שלמד לאהוב ככה חזק ילמד גם לאהוב שוב, אחרת ובוגר יותר. זה כואב בדיוק במידה שזה היה יקר.','הראשונה תמיד מרגישה כמו היחידה, כי היא פתחה בך משהו. אבל מה שהיא פתחה נשאר שלך גם בלעדיה. אתה לא מאבד את היכולת לאהוב, אתה רק מסיים פרק ראשון.'],short:['הלב שלמד לאהוב ככה חזק ילמד לאהוב שוב.','הראשונה מרגישה כמו היחידה, אבל היא לא הסוף.'],action:'תן לעצמך להתאבל בלי למהר. פרק ראשון תמיד מהדהד.'},
    {p:5,emoji:'💼',level:7,keywords:['גירושים','אני מתגרש','התגרשנו','נגמר הנישואים','אשתי עזבה','אשתי','גירושין','הנישואים נגמרו'],responses:['גירושים זה לא עוד פרידה, זה פירוק של חיים שלמים שבנית, וזה ראוי לכובד שאתה נותן לו. אל תמהר להיות בסדר. תדאג לבסיס, תישען על אנשים קרובים, ואם יש ילדים, תזכור שהיציבות שלך היא העוגן שלהם. יום אחד בכל פעם.','זה מסוג הכאבים שלא עוברים בשבוע, ואתה לא אמור לצפות מעצמך לכך. תן לעצמך זמן וסבלנות, תבנה שגרה חדשה לאט, ואל תתמודד עם זה לבד. גם גבר חזק צריך גב.'],short:['גירושים זה פירוק של חיים שלמים, זה ראוי לכובד.','אל תמהר להיות בסדר. יום אחד בכל פעם.'],action:'תישען על אנשים קרובים ותבנה שגרה חדשה לאט.'},
    {p:6,emoji:'✈️',level:6,keywords:['מערכת יחסים מרחוק','רחוקים','היא בחול','קשר מרחוק נגמר','לא החזקנו את המרחק','מרחק גדול','קשר מרחוק'],responses:['קשר מרחוק שנגמר משאיר כאב מיוחד, כי לא תמיד היה כאן כישלון, לפעמים פשוט המציאות ניצחה את הכוונות. זה לא אומר שהאהבה לא הייתה אמיתית. תרשה לעצמך להתאבל בלי להאשים אף אחד.','המרחק שוחק גם את האהבות הכי טובות, וזה לא עדות לכישלון שלך. תזכור את היפה, תשחרר את מה שלא החזיק, ותהיה עדין עם עצמך.'],short:['לפעמים המציאות ניצחה את הכוונות, זה לא כישלון שלך.','המרחק שוחק גם אהבות טובות. תהיה עדין עם עצמך.'],action:'תרשה לעצמך להתאבל בלי להאשים, ותזכור את היפה.'},
    {p:6,emoji:'🥀',level:7,keywords:['עזבה אותי בשביל','בחרה במישהו אחר','העדיפה אותו','עזבה בשביל בן אדם אחר','בחרה בו','עזבה אותי בשביל מישהו','הלכה למישהו אחר'],responses:['שהיא בחרה במישהו אחר זה מרגיש כמו פסק דין על הערך שלך, אבל זה לא. בחירה שלה מספרת עליה ועל מה שהיא חיפשה, לא על מה שאתה שווה. אתה לא נמדד לפי מי שלא בחר בך.','זה חתך עמוק כי זה מרגיש כמו תחרות שהפסדת. אבל אהבה זה לא תחרות, ואתה לא פרס. מי שמעדיף מישהו אחר פשוט לא היה שלך מלכתחילה. תפנה את הכוח פנימה.'],short:['בחירה שלה מספרת עליה, לא על הערך שלך.','אתה לא נמדד לפי מי שלא בחר בך.'],action:'תפנה את כל האנרגיה פנימה, לא לתחרות שלא קיימת.'},
    {p:8,emoji:'📸',level:5,keywords:['התמונות שלנו','מסתכל בתמונות','לא מוחק תמונות','שומר תמונות','התמונות שלה בטלפון','מסתכל בתמונות שלה','גולל בתמונות'],responses:['להסתכל בתמונות שוב ושוב זה כמו לפתוח תפר שכבר התחיל להתאחות. אתה לא חייב למחוק הכל היום, אבל תוציא אותן מהעין: תעביר לתיקייה נעולה או תבקש מחבר לשמור אותן בצד. מה שלא רואים, פחות מדמם.','כל גלילה בתמונות זו מנה של עצב שאתה נותן לעצמך מרצון. הזיכרונות לא ילכו לשום מקום אם תשים אותם בצד לזמן מה. תן לעצמך הפוגה מהמסך הזה.'],short:['להסתכל בתמונות זה לפתוח תפר שהתחיל להתאחות.','מה שלא רואים, פחות מדמם.'],action:'העבר את התמונות לתיקייה נעולה, לא חייב למחוק היום.'},
    {p:7,emoji:'🎵',level:6,keywords:['היום יום השנה','היום התאריך שלנו','שמעתי את השיר שלנו','השיר שלנו','יום השנה שלנו','התאריך שהכרנו','היום שנה'],responses:['תאריכים ושירים הם מוקשים רגשיים, והיום פגעת באחד. זה בסדר שזה הציף אותך. אבל תאריך הוא רק יום בלוח, והשיר הוא רק צלילים, המשמעות שאתה נותן להם היא שלך לשנות. תעבור את היום הזה ברוך, הוא יחלוף.','יום שנה או שיר משותף מחזירים הכל בבת אחת, וזה מכה. אל תילחם ברגש, תן לו לעבור דרכך. מחר התאריך הזה כבר מאחוריך, והשיר יחזור להיות סתם שיר.'],short:['תאריך הוא רק יום בלוח, המשמעות שלו שלך לשנות.','אל תילחם ברגש, תן לו לעבור דרכך. הוא יחלוף.'],action:'תעבור את היום ברוך, ותשמור מרחק מהשיר הזה היום.'},
    {p:6,emoji:'🤝',level:5,keywords:['אמרה בואו נישאר חברים','רק חברים','להישאר בקשר כחברים','הציעה חברות','בואו נהיה חברים','נשארים חברים'],responses:['חברות מוצעת מיד אחרי פרידה היא בדרך כלל מתנה מורעלת: היא מרגיעה אותה ומדממת אותך. אתה לא חייב להסכים להיות חבר של מי שאתה עוד אוהב. מרחק עכשיו הוא לא נקמה, הוא ריפוי. אולי בעתיד, לא היום.','להיות חבר שלה כשהלב שלך עוד שם זה כמו לעמוד ליד אש ולהתפלא שנכווית. תסביר בעדינות שאתה צריך מרחק, ותיקח אותו. חברות אמיתית, אם בכלל, אפשרית רק אחרי שתחלים.'],short:['חברות מיד אחרי פרידה מרגיעה אותה ומדממת אותך.','מרחק עכשיו הוא לא נקמה, הוא ריפוי.'],action:'קח מרחק עכשיו. חברות, אם בכלל, רק אחרי שתחלים.'},
    {p:2,emoji:'🩺',level:8,keywords:['לא אוכל','לא ישן','לא מתפקד','ירדתי במשקל','אין לי תיאבון','לא מצליח לקום','לא מצליח לאכול','לא מצליח לישון'],responses:['זה כבר לא רק לב שבור, זה הגוף שלך צועק. כרגע אל תנסה לפתור את כל הקשר — תחזיר את עצמך לתפקוד בסיסי. מים, משהו קטן לאכול, מקלחת, הליכה של 10 דקות. קודם תחזק את הגוף, אחר כך תתמודד עם הלב.','כשהגוף מפסיק לאכול ולישון, זה סימן שאתה צריך לרדת מהראש ולעלות על עצמך. שכח מהפרידה לרגע — המשימה הלילה היא רק להחזיר לגוף דלק ומנוחה. כוס מים, ביס אוכל, מקלחת חמה, ואור כבוי מוקדם.','אתה לא חלש, אתה פשוט רץ על ריק כבר כמה ימים. אף אחד לא חושב בהיר כשהוא לא ישן ולא אוכל. תוריד ציפיות מעצמך להיום, ותטפל בבסיס: מים, אוכל קטן, שינה. הלב יחכה לבוקר.'],short:['לפני שאתה פותר את הלב — תטפל בגוף.','הגוף צועק לפני הלב. קודם דלק ומנוחה.'],action:'מים, משהו קטן לאכול, מקלחת, והליכה של 10 דקות.'},
    {p:3,emoji:'📵',level:6,keywords:['לשלוח לה הודעה','לשלוח לו הודעה','בא לי לכתוב','מה לרשום לה','אולי הודעה אחת','רק לשאול מה קורה','רוצה לדבר איתה','רוצה לדבר איתו','הודעה אחרונה','לשלוח הודעה','מה לרשום','לדבר איתה'],responses:['לא עכשיו. הודעה שיוצאת מלחץ כמעט תמיד יוצאת חלשה, ארוכה מדי, ומחזירה אותך אחורה. אם היא באמת רוצה לדבר — היא יודעת איפה למצוא אותך. תכתוב את ההודעה בפתקים, אבל אל תשלח 24 שעות.','אחי, עצור את האצבע. הודעה אחרונה תמיד הופכת לעוד אחת, ואז לעוד אחת, ואז אתה שוב בהתחלה. אם אתה חייב לפרוק — תכתוב לעצמך בפתקים ותחכה יום. מחר תודה לעצמך שלא שלחת.','השאלה היא לא מה לכתוב לה, אלא למה אתה מרגיש שאתה חייב. הדחף לשלוח עכשיו זה הכאב מדבר, לא אתה. תן לזה 24 שעות של שקט, ואם מחר זה עדיין נראה חכם — נדבר.'],short:['אם אתה מרגיש שאתה חייב לשלוח עכשיו — זה בדיוק הסימן לא לשלוח.','הדחף לשלוח הוא הסימן הכי ברור לא לשלוח.'],action:'כתוב בפתקים, חכה 24 שעות, ואז תקרא שוב.'},
    {p:3,emoji:'🚶',level:6,keywords:['להיפגש איתה','להיפגש איתו','רוצה לראות אותה','נדבר פנים מול פנים','רק קפה','רק שיחה','לבוא אליה'],responses:['פגישה כשאתה מפורק לא תראה לה אהבה — היא תראה שאתה לא יציב. אם יש שיחה, שתהיה רגועה, קצרה וברורה, לא תחנונים. כרגע קודם תתייצב. אל תלך לפגישה כדי להישבר מול מי שכבר התרחק.','לא כל "רק קפה" זה באמת רק קפה — לפעמים זו דרך מכובדת ליפול שוב. אם אתה לא יכול לשבת מולה זקוף ורגוע, זה לא הזמן. תתחזק קודם, אחר כך תחליט אם בכלל שווה.'],short:['אל תגיע לפגישה כדי להתחנן. תגיע רק אם אתה יכול לעמוד זקוף.','אם אתה לא יכול לשבת מולה רגוע — זה לא הזמן להיפגש.'],action:'קודם תתייצב. אם יש שיחה — קצרה, רגועה, בלי תחנונים.'},
    {p:4,emoji:'🥊',level:7,keywords:['בן דוד שלה','ידיד שלה','האקס שלה','עם מישהו אחר','היא איתו','היא הלכה אליו','היא דיברה איתו','היא יוצאת עם מישהו','נעלמה עם'],responses:['פה אתה חייב לעצור. אתה לא בתחרות עם בן דוד, ידיד, אקס או כל דמות אחרת בסרט הזה. אם מישהי באמת רוצה אותך, היא לא משאירה אותך להילחם על המקום שלך. אל תנסה לנצח בקרב שכבר מוריד אותך.','אני מבין שזה שורף לך את הראש, אבל תקשיב טוב: אתה לא בתחרות עם אף אחד. אם היא בחרה להתרחק ולהשאיר אותך מבולבל, אתה לא אמור לרדוף כדי לקבל מקום. תן לשקט שלך לדבר יותר חזק מהכאב שלך.','ברגע שאתה נלחם על מקום מול מישהו אחר, כבר הפסדת את הדבר הכי חשוב — את הכבוד שלך. גבר לא מתחרה על אישה, גבר בוחר מי שבוחרת בו בחזרה. תפנה את הראש מהם, ותחזור לעצמך.'],short:['אתה לא מתחרה על מקום אצל מישהי. או שיש לך מקום — או שאתה הולך.','גבר לא מתחרה על אישה. או שבוחרים בך, או שאתה הולך.'],action:'אל תילחם על מקום. תן לשקט שלך לדבר.'},
    {p:4,emoji:'💔',level:7,keywords:['בגדה בי','שיקרה לי','הסתירה ממני','עשתה לי קטע','רימתה אותי','שברה לי אמון','שיחקה בי'],responses:['אם האמון נשבר, אל תנסה לתקן אותו כשאתה על הברכיים. יכול להיות שכואב לך, אבל כאב לא אומר שאתה צריך לחזור למקום שפגע בך. קודם תתייצב, אחר כך תחליט. לא מקבלים החלטות על קשר מתוך השפלה.','בגידה זה לא רק מה שהיא עשתה — זה מה שזה עושה לך עכשיו לביטחון. אל תמהר להאשים את עצמך או לרוץ לתקן. תן לעצמך זמן להתייצב, ורק אז תסתכל על זה בעיניים נקיות.'],short:['מי ששבר לך שקט לא מקבל מפתח חזרה כל כך מהר.','אמון שנשבר לא מתקנים כשאתה על הברכיים.'],action:'קודם תתייצב, אחר כך תחליט.'},
    {p:5,emoji:'👻',level:6,keywords:['היא נעלמה','הוא נעלם','מסננת','לא עונה','לא מגיבה','השאירה אותי באוויר','גוסטינג','ghosting','נעלמה לי'],responses:['מי שנעלם לך לא צריך לקבל ממך מרדף פרימיום. שתיקה היא גם תשובה, גם אם היא תשובה מגעילה. אל תנסה לפענח בן אדם שלא נותן לך כבוד בסיסי. תעצור את המרדף עכשיו.','היא לא עונה? זו כבר התשובה. אתה יכול להמשיך לנחש ולשלוח סימני שאלה, או לקבל את זה ולשחרר. בן אדם שרוצה אותך לא משאיר אותך באוויר. אל תרדוף אחרי מי שבחר להיעלם.','כל דקה שאתה מבזבז על "למה היא לא עונה" זו דקה שאתה גונב מעצמך. שתיקה מספיק רועשת. תפסיק לבדוק, תפסיק לנחש, ותחזיר את הראש אליך.'],short:['היא נעלמה? אל תרוץ אחרי עשן.','שתיקה היא גם תשובה. תפסיק לנחש.'],action:'תעצור את המרדף. שתיקה היא גם תשובה.'},
    {p:5,emoji:'🚪',level:6,keywords:['היא נפרדה ממני','הוא נפרד ממני','זרקה אותי','עזב אותי','עזבה אותי','סיימה את זה','הוא סיים את זה','נפרדה ממני'],responses:['זה כואב, אבל שים לב לדבר אחד: היא קיבלה החלטה. עכשיו התפקיד שלך הוא לא לשכנע אותה שהיא טועה, אלא לא לאבד את עצמך בדרך. אל תרדוף אחרי דלת שנסגרה לך בפנים. קח צעד אחורה ותן לשקט לעבוד לטובתך.','פרידה זה לא מבחן שאתה צריך לעבור בשכנוע. היא בחרה — וזכותה. הכאב שלך אמיתי, אבל הוא לא סיבה להתחנן. תן לעצמך להתאבל בלי לרדוף, וזה כבר יתחיל להשתחרר.'],short:['מי שסיים — סיים. אתה לא צריך להתחנן על מקום.','אל תרדוף אחרי דלת שנסגרה בפנים.'],action:'קח צעד אחורה ותן לשקט לעבוד לטובתך.'},
    {p:5,emoji:'📩',level:5,keywords:['היא שלחה לי הודעה','הוא שלח לי הודעה','היא כתבה לי','הוא כתב לי','היא חזרה','הוא חזר'],responses:['יופי, אבל אל תקפוץ כאילו חיכית ליד הדלת. תענה רגוע, קצר, בלי לפתוח את כל הלב בבת אחת. הודעה אחת לא מוחקת את כל מה שהיה. קודם תבדוק אם יש פה כוונה אמיתית או רק געגוע רגעי.','היא כתבה — נחמד, אבל תנשום לפני שאתה עונה. אל תשפוך עליה את כל מה שאגרת בשבועיים. תשובה קצרה ורגועה שומרת עליך בשליטה. תן לזמן להראות אם זה רציני או רגע חולף אצלה.'],short:['היא כתבה? תנשום. לא רצים חזרה למקום שפגע בך.','הודעה אחת לא מוחקת את כל מה שהיה. תענה רגוע.'],action:'תענה רגוע, קצר, בלי לפתוח את כל הלב בבת אחת.'},
    {p:5,emoji:'👀',level:5,keywords:['רואה סטורי ולא עונה','צפתה לי בסטורי','עושה לי לייק','מגיבה באימוגי','שולחת סימנים','ראתה לי את הסטורי'],responses:['צפייה בסטורי זה לא חזרה, לייק זה לא התנצלות, ואימוגי זה לא קשר. אל תבנה תקווה על פירורים דיגיטליים. מי שרוצה לדבר איתך — מדבר ברור. תפסיק לבדוק ותן לעצמך שקט.','היא צופה אבל לא כותבת? זה בדיוק ה"מספיק כדי שלא תשכח אותי, מעט כדי לא להתחייב". אל תיפול לזה. פירור זה לא ארוחה, וסימן קטן זה לא קשר. תדרוש בהירות או תלך.'],short:['אל תבנה בית מפירורים.','פירור זה לא קשר. תדרוש בהירות או תלך.'],action:'אל תבנה תקווה על פירורים. מי שרוצה — מדבר ברור.'},
    {p:5,emoji:'🌬️',level:5,keywords:['צריכה זמן','צריך זמן','צריכה מרחב','רוצה לחשוב','מבולבלת','לא יודעת מה היא רוצה','הוא מבולבל'],responses:['כשמישהו מבקש מרחב — תן מרחב אמיתי, לא מרחב עם 12 הודעות ובדיקות סטורי. אם תלחץ, אתה רק תוכיח שאתה לא מסוגל לכבד גבול. תן שקט. מי שרוצה לחזור לשיחה, יודע איך.','מרחב זה מרחב, לא מבחן שאתה עובר עם עוד הודעה. ככל שתלחץ, ככה תדחוף אותה רחוק יותר. תן לה שקט אמיתי, ותשתמש בזמן הזה כדי להתחזק בעצמך במקום לספור דקות.'],short:['מרחב זה לא מבחן שאתה עובר עם הודעות. מרחב זה שקט.','ככל שתלחץ כשביקשו מרחב — כך תדחוף אותה רחוק יותר.'],action:'תן שקט אמיתי, בלי הודעות ובדיקות.'},
    {p:6,emoji:'❤️‍🩹',level:6,keywords:['אני אוהב אותה','אני אוהבת אותו','עדיין אוהב','עדיין אוהבת','לא הפסקתי לאהוב','הלב שלי אצלה','היא החיים שלי','הוא החיים שלי'],responses:['ברור שאתה אוהב, זה לא נכבה בלחיצת כפתור. אבל אהבה לא אומרת שאתה צריך לרדוף אחרי מי שלא בוחר בך כרגע. געגוע זה רגש, לא הוראה לשלוח הודעה. היום אתה לא רודף — היום אתה מחזיר שליטה.','אתה יכול לאהוב אותה ועדיין לבחור בעצמך. זה לא סותר. אהבה אמיתית לא דורשת שתמחק את עצמך בשביל מישהי שכבר הלכה. תן ללב לאהוב, אבל אל תיתן לו להחליט את המעשים שלך הלילה.','אהבה שהיא חד-צדדית עכשיו זה לא אהבה שמתה — זה אהבה שצריכה לחזור אליך. תפנה חלק ממנה לעצמך. אתה לא צריך להפסיק להרגיש, אתה רק צריך להפסיק לרדוף.'],short:['לא כל געגוע הוא סימן לחזור. לפעמים זה פשוט גמילה.','אתה יכול לאהוב אותה ועדיין לבחור בעצמך.'],action:'היום אתה לא רודף — היום אתה מחזיר שליטה.'},
    {p:6,emoji:'🌱',level:5,keywords:['היא חשובה לי','הוא חשוב לי','היא הכל בשבילי','הוא הכל בשבילי','לא רוצה לאבד אותה','היא מיוחדת','הוא מיוחד'],responses:['יכול להיות שהיא חשובה לך מאוד. אבל השאלה האמיתית היא כמה אתה חשוב לעצמך בתוך הסיפור הזה. אם כדי לשמור עליה אתה מוחק את עצמך — זה כבר לא אהבה, זה פחד. אל תעשה פעולה שתגרום לך להיראות קטן.','כשמישהי הופכת ל"הכל שלך", אתה נהיה כלום בלעדיה — וזה מקום מסוכן. היא יכולה להיות חשובה בלי להיות כל העולם שלך. תחזיר לעצמך קצת מהמקום שנתת לה.'],short:['מי שחשוב לך לא אמור לגרום לך להפסיק להיות חשוב לעצמך.','אל תיתן למישהי להיות כל העולם שלך.'],action:'אל תעשה פעולה שתגרום לך להיראות קטן.'},
    {p:6,emoji:'🌊',level:5,keywords:['מתגעגע','חסרה לי','חסר לי','קשה לי בלעדיה','קשה לי בלעדיו','מתגעגע לקול שלה','מתגעגעת','לא מצליח לשחרר','לא מצליח לשחרר אותה'],responses:['ברור שאתה מתגעגע. זה לא אומר שהקשר היה נכון — זה אומר שהמוח שלך התרגל אליה. געגוע הוא גל: הוא עולה, שורף, ואז יורד. אל תקבל החלטה קבועה בגלל גל זמני.','הגעגוע הכי חזק בא דווקא בלילה, כשהראש שקט והכל מתגבר. אל תיתן לגל הזה להחליט בשבילך. הוא ירד עד הבוקר. תחזיק חזק ואל תעשה שום דבר שתתחרט עליו.','אתה לא מתגעגע אליה, אתה מתגעגע להרגשה שהיה לך מישהו. זה הבדל ענק. תן לזמן להפריד בין השניים, ותגלה שהחוסר הזה קטן בכל שבוע.'],short:['געגוע זה גל. אל תטבע בו.','אתה מתגעגע להרגשה, לא בהכרח אליה.'],action:'אל תקבל החלטה קבועה בגלל גל זמני.'},
    {p:6,emoji:'🌟',level:5,keywords:['לא אמצא כמוה','אין כמוה','היא הכי יפה','היא מושלמת','אף אחת לא כמוה','הוא היחיד','לא יהיה לי עוד כזה'],responses:['כרגע המוח שלך מוכר לך נוסטלגיה במחיר מופקע. אתה לא מתגעגע רק אליה — אתה מתגעגע לגרסה שלה שהייתה לך בראש. העולם לא נגמר באדם אחד, גם אם עכשיו זה מרגיש ככה. תן למציאות קצת זמן לנקות את הפילטר.','"אין כמוה" זה מה שהכאב לוחש לך, לא האמת. אחרי כל אקסית מרגישים ככה, ותמיד מגיע מישהו שמוכיח את ההפך. תוריד את הפילטר הזהוב לאט, ותראה גם את מה שלא עבד.'],short:['המוח שלך שם עליה פילטר. תוריד אותו לאט.','"אין כמוה" זה הכאב מדבר, לא האמת.'],action:'תן למציאות זמן לנקות את הפילטר.'},
    {p:6,emoji:'⏳',level:6,keywords:['רוצה שהיא תחזור','רוצה שהוא יחזור','שתחזור אליי','שיחזור אליי','אני מחכה לה','אולי היא תתחרט','אולי הוא יתחרט','אולי היא תחזור','שתחזור'],responses:['אולי היא תחזור ואולי לא. אבל החיים שלך לא יכולים להיות על מצב המתנה עד שמישהי תחליט מה היא מרגישה. אם היא תחזור כשאתה חזק — תבחר ממקום נקי. אם היא תחזור כשאתה שבור — אתה פשוט תיפול שוב.','לחכות שהיא תתחרט זה לשים את החיים שלך בידיים שלה. אל תעשה את זה. תחזור לעצמך, תתחזק, תמשיך הלאה — ואם היא תחזור, תפגוש גבר שכבר לא צריך אותה כדי להיות בסדר.'],short:['אל תחכה שמישהו יחזור כדי שאתה תחזור לעצמך.','לחכות שהיא תתחרט זה לשים את החיים שלך בידיים שלה.'],action:'תחזור לעצמך קודם, אל תחיה על המתנה.'},
    {p:6,emoji:'🥊',level:6,keywords:['להילחם עליה','להילחם עליו','לא מוותר','אני אוכיח לה','אני אראה לה','צריך להחזיר אותה'],responses:['להילחם על אהבה זה יפה רק כששני הצדדים בתוך הזירה. אם אתה היחיד שנלחם, זה לא רומנטי — זה מתיש. אל תנסה להוכיח שאתה ראוי למי שלא בוחר להישאר. תילחם על עצמך קודם.','אתה לא צריך "להוכיח" לה כלום. אהבה זה לא בית משפט. אם צריך לשכנע מישהי להישאר, היא כבר בחרה ללכת. תפנה את כל האנרגיה הזאת פנימה — זו המלחמה היחידה ששווה עכשיו.'],short:['אם אתה היחיד שנלחם, זו לא אהבה — זו רדיפה.','אם צריך לשכנע מישהי להישאר, היא כבר בחרה ללכת.'],action:'תילחם על עצמך קודם.'},
    {p:6,emoji:'🕯️',level:6,keywords:['אוהבת אותי אבל לא יכולה','אוהב אותי אבל לא יכול','יש לה רגשות אבל','אוהבת ועדיין עזבה'],responses:['אל תיתפס רק במילה אוהבת. תסתכל על הפעולה. אם בן אדם אוהב אבל בוחר ללכת, אתה מתייחס לבחירה — לא לכותרת. מילים מחממות, אבל מעשים בונים מציאות.','"אוהבת אבל לא יכולה" זה משפט שמשאיר אותך תלוי על וו. אהבה אמיתית מוצאת דרך, לא תירוצים. אל תיתפס למילים החמות — תסתכל מה היא באמת עשתה, ותכבד את זה.'],short:['אל תתמכר למילים יפות כשהמעשים קרים.','אהבה מוצאת דרך, לא תירוצים.'],action:'תסתכל על הבחירה, לא על הכותרת.'},
    {p:6,emoji:'🛑',level:7,keywords:['היא פגעה בי','הוא פגע בי','עשתה לי רע','השפילה אותי','פגעה בי ועדיין רוצה אותה','לא טוב לי איתה אבל רוצה אותה'],responses:['זה שהלב רוצה לא אומר שזה בריא. לפעמים אתה נמשך למי שפגע בך כי אתה רוצה שהוא גם ירפא אותך. אבל מי ששבר לך את השקט לא תמיד זכאי לקבל אותך חזרה. תבחר בכבוד שלך לפני הדחף שלך.','להשתוקק למי שפוגע בך זה לא אהבה, זה הרגל של כאב. אתה מחפש ממנה את המרפא לפצע שהיא עצמה יצרה. תפסיק לחפש מים אצל מי ששרף אותך. תבחר בשקט שלך.'],short:['לא חוזרים למי ששרף לך את הבית רק כי קר בחוץ.','אל תחפש מים אצל מי ששרף אותך.'],action:'תבחר בכבוד שלך לפני הדחף שלך.'},
    {p:6,emoji:'🎢',level:6,keywords:['פעם חם פעם קר','יום אוהבת יום נעלמת','פעם רוצה פעם לא','מבלבלת אותי','נותנת תקווה ואז נעלמת'],responses:['חם-קר זה לא רומנטיקה, זה רכבת הרים שמפרקת אותך. קשר בריא לא אמור לגרום לך לנחש כל יום איפה אתה עומד. אל תתמכר לרגעים טובים אם המחיר שלהם הוא שבוע של חרדה. יציבות חשובה יותר מדרמה.','כשמישהי נותנת תקווה ואז נעלמת, אתה חי במתח קבוע — וזה שוחק אותך יותר מפרידה נקייה. אל תבלבל אדרנלין עם אהבה. אתה מגיע ליציבות, לא לרכבת הרים.'],short:['מי שמבלבל אותך כל יום לא בונה איתך חיים.','אל תבלבל אדרנלין עם אהבה.'],action:'יציבות חשובה יותר מדרמה.'},
    {p:7,emoji:'🔥',level:6,keywords:['אני עצבני','בא לי להתפוצץ','אני שונא אותה','בא לי לצעוק','בא לי לשלוח לה הכל','נמאס לי'],responses:['הכעס שלך מובן, אבל אל תיתן לו לנהוג במקומך. הודעה מתוך עצבים תיראה טוב שתי דקות ואז תתחרט. תוציא את זה בפתקים, באימון, בהליכה — לא עליה. הכוח שלך עכשיו הוא לא להגיב.','כעס זה אנרגיה, והשאלה היא רק לאן אתה מכוון אותה. אם תשפוך אותה עליה — תפסיד. אם תשפוך אותה על הליכון, על אימון, על פתקים — תרוויח. אל תיתן לרגע לשרוף לך את הכבוד.'],short:['אל תיתן לרגע עצבני להרוס לך את הכבוד.','כעס זה אנרגיה — כוון אותה פנימה, לא עליה.'],action:'תוציא את זה בפתקים, באימון או בהליכה — לא עליה.'},
    {p:7,emoji:'🌾',level:5,keywords:['אני אשם','אני אשמה','הרסתי הכל','טעיתי','פישלתי','בגללי זה נגמר','אם הייתי עושה אחרת','הייתי צריך להשתנות'],responses:['יכול להיות שטעית, אבל טעות לא אומרת שאתה צריך לשבת בכלא רגשי. תיקח אחריות, תלמד, ותפסיק להרביץ לעצמך בראש. אתה לא מתקן קשר דרך השפלה עצמית. תתקן את עצמך בשבילך, לא כדי להתחנן שיקבלו אותך.','להאשים את עצמך בלי סוף זה לא אחריות, זה עונש. כן, אולי פישלת — כמו כל בן אדם. תיקח את הלקח, תשתפר, ותוותר על ההלקאה. השיפור הכי טוב בא מכבוד עצמי, לא מבוז עצמי.'],short:['לקחת אחריות זה חזק. לרסק את עצמך זה מיותר.','להאשים את עצמך בלי סוף זה לא אחריות, זה עונש.'],action:'תלמד מהטעות ותפסיק להרביץ לעצמך בראש.'},
    {p:8,emoji:'📵',level:5,keywords:['לבדוק לה סטורי','ראיתי סטורי','היא העלתה','הוא העלה','להיכנס לפרופיל','לבדוק אם היא מחוברת','אינסטגרם','טיקטוק','וואטסאפ אונליין','לבדוק סטורי','סטורי','צפתה לי','מחוברת','ראיתי שהיא העלתה'],responses:['אל תעשה לעצמך בדיקת דופק דרך הסטורי שלה. כל צפייה קטנה מחזירה אותך להתחלה. אתה לא באמת מחפש מידע — אתה מחפש מכה. תסגור את האפליקציה ותן לעצמך 7 ימים בלי לבדוק.','כל כניסה לפרופיל שלה זה עוד מנה של רעל שאתה נותן לעצמך מרצון. אתה לא תמצא שם תשובה, רק כאב חדש. תשתיק אותה לשבוע, ותראה כמה מהר הראש מתחיל להתנקות.','בדיקת סטורי זה ההרגל שהכי מעכב אותך. תחשוב על זה כמו עישון — כל "רק פעם אחת" מחזיר אותך להתמכרות. שבוע בלי לבדוק, וזה משנה לך את כל השבוע.'],short:['סטורי זה לא תשובה. זה מלכודת.','כל כניסה לפרופיל שלה זה עוד מנה של רעל.'],action:'השתק סטורי ואל תבדוק 7 ימים.'},
    {p:8,emoji:'🎭',level:5,keywords:['לגרום לה לקנא','להעלות סטורי שתראה','שתראה שהמשכתי','לעשות לה דווקא','להראות לה שאני עם מישהי'],responses:['אל תבנה הצגה כדי שמישהי תמחא כפיים מהצד. לעשות לה קנאה זה עדיין להיות מנוהל על ידה. אם אתה מעלה משהו — שזה יהיה בשביל החיים שלך, לא כדי לבדוק אם היא צופה.','כל מהלך שנועד לגרום לה לקנא מכריז בעצם: "אני עדיין תלוי בך". הדרך הכי חזקה היא לא הצגה — היא באמת להמשיך הלאה. תחיה בשבילך, לא בשביל התגובה שלה.'],short:['אם זה בשביל שהיא תראה, אתה עדיין תקוע אצלה.','להמשיך באמת חזק יותר מכל הצגה של קנאה.'],action:'תעלה דברים בשביל החיים שלך, לא בשבילה.'},
    {p:8,emoji:'🧹',level:5,keywords:['לחסום אותה','למחוק אותה','למחוק תמונות','להוריד עוקב','לעשות אנפולו','למחוק צאט'],responses:['אם זה עוזר לך לנשום — תעשה את זה. חסימה היא לא ילדותית כשהיא מגינה על השקט שלך. אתה לא חייב להשאיר דלת פתוחה למי שכל פעם פותח לך את הפצע. תבחר במה שמרגיע אותך, לא במה שנראה טוב מבחוץ.','אתה לא חוסם מתוך נקמה, אתה חוסם מתוך רחמים על עצמך. אם כל תמונה שלה מחזירה אותך אחורה — תוריד אותה מהראש דרך המסך. השקט שלך שווה יותר מ"איך זה ייראה".'],short:['לפעמים לחסום זה לא נקמה. זה עזרה ראשונה.','אתה חוסם מתוך רחמים על עצמך, לא נקמה.'],action:'תבחר במה שמרגיע אותך, לא במה שנראה טוב מבחוץ.'},
    {p:8,emoji:'🌤️',level:5,keywords:['היא מאושרת','הוא מאושר','היא המשיכה','הוא המשיך','אני שבור והיא בסדר','היא חיה רגיל'],responses:['אתה רואה תמונה, לא מציאות מלאה. אנשים יכולים להיראות מאושרים גם כשהם בורחים מעצמם. אבל גם אם היא באמת המשיכה — זה לא אומר שהפסדת. זה אומר שאתה צריך להפסיק למדוד את ההחלמה שלך לפי הקצב שלה.','סטורי מאושר זה לא תעודת אמת. ובכל מקרה — הקצב שלה הוא לא הקצב שלך. אתה מתאבל, זה בריא, וזה ייקח את הזמן שלו. אל תיתן לחיים המצולמים שלה לזרז לך את הפצע.'],short:['אל תשווה את הכאב שלך לסטורי שלה.','הקצב שלה הוא לא הקצב שלך.'],action:'תפסיק למדוד את ההחלמה שלך לפי הקצב שלה.'},
    {p:8,emoji:'🧱',level:5,keywords:['המשפחה שלה','אמא שלה','אבא שלה','חברות שלה','חברים שלה','כולם נגדי','דיברו עליי','הסיתו אותה'],responses:['יכול להיות שהסביבה השפיעה, אבל בסוף היא אדם בוגר עם בחירה. אל תבנה את כל הכאב שלך על זה שהם השפיעו עליה. מי שבוחר אותך באמת לא נעלם בגלל רעש מסביב. תפסיק להילחם במשפחה שלה בראש שלך.','להאשים את המשפחה שלה זה נוח, אבל זה גם משאיר אותך תקוע. היא בחרה — גם אם היה לחץ. תפנה את הראש מהמלחמה בהם, ותחזיר את המיקוד לעצמך ולמה שאתה צריך עכשיו.'],short:['גם אם לחצו עליה — הבחירה שלה עדיין הבחירה שלה.','להאשים את הסביבה זה נוח, אבל זה משאיר אותך תקוע.'],action:'תפסיק להילחם במשפחה שלה בראש שלך.'},
    {p:8,emoji:'🔁',level:6,keywords:['לחזור אליה','לחזור אליו','כדאי לחזור','לתת עוד צאנס','לתת הזדמנות','לחזור לקשר','רוצה לחזור'],responses:['אל תשאל אם אתה מתגעגע. תשאל אם משהו באמת השתנה. אם אותו כאב, אותה התנהגות ואותו בלגן מחכים לך שם — אתה לא חוזר לאהבה, אתה חוזר להרגל. צאנס נותנים לשינוי, לא לנוסטלגיה.','לפני שאתה חוזר, תעצור ותשאל שלוש שאלות: האם משהו השתנה? האם יש כבוד? האם היא באמת בוחרת בך? אם התשובה לא ברורה לשלושתן — אתה חוזר להרגל, לא לאהבה.'],short:['לא חוזרים כי מתגעגעים. חוזרים רק אם משהו השתנה באמת.','צאנס נותנים לשינוי, לא לנוסטלגיה.'],action:'תשאל: האם משהו השתנה? האם יש כבוד? האם יש יציבות?'},
    {p:9,emoji:'🕊️',level:5,keywords:['סגירת מעגל','חייב להבין למה','צריך תשובות','לדבר פעם אחרונה','שיחה אחרונה','לסיים יפה','רק להבין'],responses:['סגירת מעגל זה לפעמים שם יפה לעוד מנה של כאב. לא תמיד תקבל תשובה שתסגור אותך. לפעמים ההתנהגות שלה כבר אמרה מספיק. אל תחפש הסבר ממי שיצר את הבלגן.','אתה מחפש "למה", אבל גם אם תקבל תשובה — היא לא תעצור את הכאב. הסגירה האמיתית היא לא שיחה איתה, אלא החלטה שלך להפסיק לפתוח את הדלת. תן לעצמך את הסגירה הזאת.'],short:['לפעמים סגירת מעגל היא פשוט להפסיק לפתוח את הדלת.','גם תשובה מושלמת לא תעצור את הכאב.'],action:'אל תחפש הסבר ממי שיצר את הבלגן.'}
  ];
  const GENERAL={emoji:'🧭',level:5,keywords:[],responses:['נשמע שאתה בתוך סערה, וזה הגיוני. אבל אל תיתן לרגש של עכשיו לנהל את החיים שלך. לפני כל פעולה, הודעה, סטורי, שיחה או פגישה, תחכה רגע ותשאל: זה יחזיר לי כבוד או יוריד אותי? היום אתה בוחר לא לרדוף.','אני שומע שקשה לך עכשיו. תעשה טובה לעצמך ואל תעשה שום מהלך גדול מתוך הסערה. תנשום, תן ליום לעבור, ותשאל את עצמך לפני כל צעד: זה מקרב אותי לעצמי או מרחיק? היום אתה בוחר בשקט.','כל מה שאתה מרגיש עכשיו לגיטימי, אבל רגש הוא יועץ גרוע לפעולות. אל תשלח, אל תבדוק, אל תרדוף, רק היום. תן לראש להתבהר ומחר תחליט מעמדה חזקה יותר.','אתה לא צריך לפתור את כל הקשר הלילה. המשימה היחידה עכשיו היא לעבור את הערב בשלום ולדאוג לעצמך. הלב יחכה לבוקר.','זה כואב, ואתה לא מגזים. אבל תשים לב: הכאב מדבר בקול הכי חזק דווקא כשאתה הכי עייף. תנוח, ותראה איך זה נראה מחר.','מה שאתה מרגיש זה לא חולשה, זה פשוט אהבה שאין לה לאן ללכת כרגע. תן לה לזוז דרכך בלי לפעול עליה.','נשמע שאתה מנסה להבין הכל בבת אחת, וזה מציף. אתה לא חייב תשובות הלילה. רק תעבור את היום הזה, וזה מספיק.','אתה בסדר יותר ממה שאתה מרגיש כרגע. עצם זה שאתה עוצר ושואל במקום להתפרץ, זה כוח.','הראש שלך רץ למקומות קשים, וזה טבעי בלילה. אל תיקח את המחשבות של השעה הזאת כאמת. הבוקר מוריד את עוצמת הקול.','אתה לא לבד בזה, גם אם ככה זה מרגיש עכשיו. תן למישהו קרוב לדעת שקשה לך, ותן ליום לעבור.','כרגע הכי חשוב לא לקבל החלטות גדולות. תדאג לגוף, תדאג לשינה, והשאר יסתדר לאט.','אתה בונה את עצמך מחדש, וזה לוקח זמן. תהיה סבלני עם עצמך כמו שהיית עם חבר טוב.','זה שלב, לא תחנה סופית. תיתן לזמן לעשות את שלו ותפסיק לבדוק כל רגע איפה אתה עומד.','תנשום עמוק. אתה לא חייב להיות חזק הלילה, אתה רק צריך לעבור אותו.'],short:['כשאתה לא יודע מה לעשות, אל תעשה משהו מתוך פאניקה.','רגש הוא יועץ גרוע לפעולות. אל תפעל מהסערה.','אתה לא חייב לפתור הכל הלילה.','תעבור את הערב, זה מספיק להיום.','הכאב אמיתי, אבל הוא לא הסוף.','תדאג לעצמך קודם, את השאר תבין אחר כך.','אתה חזק יותר ממה שזה מרגיש עכשיו.','תן ללילה לעבור לפני שאתה מחליט משהו.'],action:'לפני כל פעולה תשאל: זה יחזיר לי כבוד או יוריד אותי?'};
  function matchIntent(text){ const t=(text||'').toLowerCase(); let best=null; for(const I of INTENTS){ if(I.keywords.some(function(k){return t.indexOf(k)>=0;})){ if(!best||I.p<best.p) best=I; } } return best; }
  function localAnswer(text){ var I=matchIntent(text)||GENERAL;
    var vArr=(I.short&&I.short.length)?I.short:GEN_VERDICTS;
    var mArr=(I.responses&&I.responses.length)?I.responses:GENERAL.responses;
    return { emoji:I.emoji, level:I.level, verdict:pickNR(vArr,'vrd'), message:pickNR(mArr,'msg'), tip:(I.action||pickNR(HE_ACTIONS,'act')), closer:pickNR(KONTRA,'kon') }; }

  // theme toggle
  function setTheme(light){ document.body.classList.toggle('light',light); $('themeBtn').textContent=light?'☀️':'🌙'; const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', light?'#f4efe7':'#0b0a10'); }
  $('themeBtn').onclick=()=>setTheme(!document.body.classList.contains('light'));

  // ===== text-to-speech: 100% offline via the browser's built-in speech engine (free, no network) =====
  let voicePref='male', speaking=false, resumeTimer=null, ttsQueue=[], ttsIdx=0;
  function ttsSupported(){ return ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance!=='undefined'); }
  if(ttsSupported()){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){} }
  function ttsIcon(on){ var b=$('ttsBtn'); if(!b) return; b.textContent=on?'⏹':'🔊'; b.setAttribute('aria-pressed',on?'true':'false'); b.setAttribute('aria-label', on?(lang==='he'?'עצור הקראה':'Stop reading'):(lang==='he'?'הקרא את התשובה':'Read the answer')); }
  function pickVoice(){ let vs=[]; try{ vs=speechSynthesis.getVoices(); }catch(e){} const want=lang==='he'?'he':'en'; let pool=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf(want)===0); if(lang==='he'){ const pref=pool.find(v=>/carmit|hebrew|עברית/i.test(v.name)); if(pref) return pref; } if(!pool.length) pool=vs;
